services:
  - type: web
    name: microfams-backend
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://microfams.vercel.app
      # Vercel preview origins are restricted in code to the Micro Fams project hostname pattern.

      # Provider-dependent capabilities remain fail-closed until these values and
      # their corresponding approval/readiness metadata are configured manually.
      # Render ignores new sync:false values when updating an existing service.
      - key: USE_MOCK_KYC
        value: "false"
      - key: IDENTITY_PROVIDER
        sync: false
      - key: IDENTITY_PROVIDER_ENVIRONMENT
        sync: false
      - key: IDENTITY_FINGERPRINT_KEY
        sync: false
      - key: IDENTITY_DATA_ENCRYPTION_KEY
        sync: false
      - key: ORGANIZATION_VERIFICATION_PROVIDER
        sync: false
      - key: ORGANIZATION_REGISTRATION_FINGERPRINT_KEY
        sync: false
      - key: BOOKING_PAYOUT_DESTINATION_ENCRYPTION_KEY
        sync: false
      - key: GROUP_TREASURY_DESTINATION_ENCRYPTION_KEY
        sync: false
      - key: LOAN_DISBURSEMENT_DESTINATION_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_PROVIDER_MODE
        sync: false
      - key: PAYMENT_MAX_RETRY_ATTEMPTS
        value: "3"
      - key: PAYMENT_COMPLIANCE_OWNER
        sync: false
      - key: PAYOUT_PROVIDER_MODE
        sync: false
      - key: PAYOUT_COMPLIANCE_OWNER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_LIVE_APPROVAL_ID
        sync: false
      - key: PAYSTACK_ACTIVATION_EVIDENCE_ID
        sync: false
      - key: PAYSTACK_CREDENTIALS_VALIDATED
        sync: false
      - key: PAYSTACK_WEBHOOK_VERIFIED
        sync: false
      - key: PAYSTACK_SETTLEMENT_ACCOUNT_ID
        sync: false
      - key: PAYMENT_RECONCILIATION_CERTIFIED
        sync: false
      - key: INTERSWITCH_API_URL
        sync: false
      - key: INTERSWITCH_AUTH_URL
        sync: false
      - key: INTERSWITCH_MARKETPLACE_URL
        sync: false
      - key: INTERSWITCH_CLIENT_ID
        sync: false
      - key: INTERSWITCH_CLIENT_SECRET
        sync: false
      - key: INTERSWITCH_TERMINAL_ID
        sync: false
      - key: INTERSWITCH_TRANSFER_FEE
        sync: false
      - key: INTERSWITCH_WEBHOOK_SECRET
        sync: false
      - key: INTERSWITCH_LIVE_APPROVAL_ID
        sync: false
      - key: INTERSWITCH_ACTIVATION_EVIDENCE_ID
        sync: false
      - key: INTERSWITCH_CREDENTIALS_VALIDATED
        sync: false
      - key: INTERSWITCH_BENEFICIARY_VALIDATION_CONFIGURED
        sync: false
      - key: INTERSWITCH_WEBHOOK_VERIFIED
        sync: false
      - key: INTERSWITCH_SETTLEMENT_ACCOUNT_ID
        sync: false
      - key: PAYOUT_RECONCILIATION_CERTIFIED
        sync: false
      - key: ONEPIPE_BASE_URL
        sync: false
      - key: ONEPIPE_API_KEY
        sync: false
      - key: ONEPIPE_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      # Legacy NIN evidence storage still consumes this separate name.
      - key: S3_BUCKET_NAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
